<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">


    <!-- Iconos y fuentes -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <title>E-Commerce</title>
</head>

<body class="body_style">
    <div class="container p-1">
        <!-- HEADER -->
        <header>
            <nav class="navbar bg-body-tertiary">
                <div class="container-fluid">
                    <a class="navbar-brand fw-bold fs-4">
                        <i class="fas fa-shopping-bag me-2"></i> E-Compras
                    </a>
                    <div class="d-flex" role="search">
                        <input class="form-control me-2" id="buscador" type="search" placeholder="Buscar..." aria-label="Search" />
                        <button id="mostrarCarrito" class="btn btn-outline-primary" data-bs-toggle="modal"
                            data-bs-target="#carritoModal">
                            <i class="fas fa-shopping-cart"></i>
                        </button>
                    </div>
                </div>
            </nav>
        </header>

        <!-- MAIN -->
        <main class="mainContainer">
            <div class="container text-center p-5">
                <!-- Lista de productos -->
                <div id="listaProductos" class="row g-4 listaProductos"></div>
            </div>
        </main>

        <!-- FOOTER -->
        <footer class="footer mt-auto py-3 bg-light">
            <div class="container">
                <span class="text-muted">&copy; 2023 E-Compras</span>
            </div>
        </footer>
    </div>

    <!-- MODAL: Carrito -->
    <div class="modal fade" id="carritoModal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1"
        aria-labelledby="carritoModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable modal-lg">
            <div class="modal-content custom-modal">
            </div>
        </div>
    </div>

    <!-- MODAL: Detalle -->
    <div id="productModal"></div>

    <!-- MODAL: Confirmación de compra -->
     <div class="modal fade" id="confirmModal" tabindex="-1" aria-labelledby="confirmModalLabel" aria-hidden="true"> </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
        crossorigin="anonymous"></script>
    <script type="module" src="./js/index.js"></script>
</body>

</html>
